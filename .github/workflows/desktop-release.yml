# 桌面版建置與發布管線
#
# 觸發：
# - push `v*` tag：三平台各建安裝檔，並建立 GitHub Release（tag 名即版本），附件含安裝檔與授權資料。
# - workflow_dispatch：同樣建三平台安裝檔，但**不**上傳 artifacts（避開額度）、**不**建立正式 Release；
#   macOS arm64 會另外把 dmg 與授權清單放進草稿 Release（tag `mac-test-<run id>-<attempt>`，測試用）。
#   不在非 tag 的 push 上自動建置（避免每次 commit 都跑三平台）。
#
# 三平台（各平台用原生 runner 各建各的；不從 Linux 交叉建 macOS）：
# - Linux x64：  ubuntu-latest      → AppImage、tar.gz
# - Linux arm64：ubuntu-24.04-arm   → AppImage、tar.gz
# - macOS（Apple Silicon）：macos-latest（現行即 arm64）→ dmg
# - Windows x64：windows-latest     → NSIS 安裝檔（.exe）
#
# 注意：
# - electron-builder **必須從 pnpm 環境呼叫**：直接跑 `node_modules/.bin/electron-builder`
#   會被判定成 npm，pnpm 沒有攤平的平台套件（`@img/sharp-*`、`sqlite-vec-*`）不會被收進產物。
#   因此一律走 `pnpm --filter @mnemoshelf/desktop run dist:*`（見 packages/desktop/package.json）。
# - 不簽章（沒有開發者憑證）：macOS 在 electron-builder.yml 設 `identity: "-"` 走 ad-hoc 簽章
#   （無身份證明的自我簽章，仍未公證）、Windows 沒有憑證，安裝檔首次開啟會有系統警告；
#   繞過方式見 docs/building.md，Release 說明也會附上。
# - 不用 secrets：發布只用 Actions 內建的 GITHUB_TOKEN（`contents: write`）。

name: desktop-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 測試基準：型別檢查、建置、測試全綠才允許發布。輸出測試摘要供 Release 說明引用。
  verify:
    name: 測試基準
    runs-on: ubuntu-latest
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      - name: 安裝 pnpm
        uses: pnpm/action-setup@v4

      - name: 安裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安裝依賴
        run: pnpm install --frozen-lockfile

      # 先建置再型別檢查：desktop 以 workspace 依賴（@mnemoshelf/server、
      # @mnemoshelf/embedder-transformers）的 dist/*.d.ts 做型別解析，fresh checkout
      # 沒有 dist 就會 TS2307；以拓撲序 build（pnpm -r）後才有解析依據，與本機一致。
      - name: 建置
        run: pnpm build

      - name: 型別檢查
        run: pnpm typecheck

      # 關閉顏色：GitHub Actions 預設 CI=true，而 vitest 使用的著色函式庫（tinyrainbow）在
      # 「環境變數 CI 存在」時，即使輸出被導向管線仍會上色——控制字元（`\e[2m`／`\e[32m` 等）
      # 會寫進 test-output.txt，再被摘進 Release 說明。NO_COLOR 一旦存在即關閉著色；
      # 注意不可改用 FORCE_COLOR=0：tinyrainbow 只檢查該變數是否「存在」（不看值），
      # 設 0 反而會開啟顏色（實測 FORCE_COLOR=0 仍會輸出 ANSI）。
      - name: 測試
        shell: bash
        env:
          NO_COLOR: "1"
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test-output.txt

      - name: 整理測試摘要
        if: always()
        shell: bash
        run: |
          # 雙重保險：即使上游仍帶控制字元（例如 NO_COLOR 未生效），這裡再清一次 ANSI
          # （SGR 色碼等 CSI 序列）。本步驟只在 ubuntu-latest 執行，GNU sed 支援 \x1b。
          # 保留 set -o pipefail：否則 grep 找不到摘要時，管線退出碼會是 sed 的 0，
          # 後備訊息就不會出現（語意退化）。
          set -o pipefail
          {
            echo "pnpm install --frozen-lockfile / pnpm build / pnpm typecheck：完成"
            echo "pnpm test 摘要（Test Files／Tests 行）："
            grep -E "Test Files|Tests " test-output.txt | sed -E 's/\x1b\[[0-9;?]*[a-zA-Z]//g' || echo "(沒有擷取到摘要，請見本次 run 的 verify job 記錄)"
          } > test-summary.txt

      - name: 上傳測試基準
        if: always() && github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: test-baseline
          path: |
            test-summary.txt
            test-output.txt
          if-no-files-found: warn
          # private repo 的 Actions artifact 額度有限（免費方案 500 MB）；短保留期避免舊產物堆滿。
          retention-days: 7

  # 三平台建置。打包後在 Linux runner 上跑 headless smoke（xvfb 內啟動、驗 /health 與 token 驗證）。
  build:
    name: 建置（${{ matrix.platform }}）
    runs-on: ${{ matrix.os }}
    # workflow_dispatch 時，macOS leg 會用 GITHUB_TOKEN 建立草稿 Release（見下方步驟）。
    # tag 建置的正式 Release 由獨立 release job 處理；這裡的 write 權限只為草稿 Release。
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            script: dist:linux
            smoke: true
            artifacts: |
              packages/desktop/dist-app/*.AppImage
              packages/desktop/dist-app/*.tar.gz
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            script: dist:linux
            smoke: true
            artifacts: |
              packages/desktop/dist-app/*.AppImage
              packages/desktop/dist-app/*.tar.gz
          - platform: macos-arm64
            os: macos-latest
            script: dist:mac
            smoke: false
            artifacts: |
              packages/desktop/dist-app/*.dmg
          - platform: windows-x64
            os: windows-latest
            script: dist:win
            smoke: false
            artifacts: |
              packages/desktop/dist-app/*.exe
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      - name: 安裝 pnpm
        uses: pnpm/action-setup@v4

      - name: 安裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # 讓安裝檔版本與 tag 一致（tag `v0.1.0` → app 版本 `0.1.0`）。
      # 只在跑在 runner 上的工作區生效，不會回寫 repo。
      - name: 同步版本號（tag → app 版本）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('node:fs');const p='packages/desktop/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');" "$VERSION"
          echo "app 版本設為 $VERSION"

      - name: 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 建置
        run: pnpm build

      - name: 建置安裝檔（electron-builder）
        run: pnpm --filter @mnemoshelf/desktop run ${{ matrix.script }}

      # 打包後 smoke：在 xvfb 內啟動打包產物（--headless），驗 /health 與 token 驗證
      # （帶 token 200／不帶 401）與優雅結束。需要 xvfb-run（GitHub 的 ubuntu runner 已內建）。
      - name: 打包後 smoke（headless）
        if: matrix.smoke
        run: node packages/desktop/scripts/smoke.mjs headless --out .tmp/desktop-ci

      # 模型快取：index smoke 首次會下載 embedding 模型（約 300 MB），之後的 run 直接沿用。
      # 路徑與下方 `--user-data` 一致；`gui` 只清 userData 的 `data`，不會清 `models`。
      - name: 快取 embedding 模型（index smoke）
        if: matrix.platform == 'linux-x64'
        uses: actions/cache@v4
        with:
          path: .tmp/desktop-ci-index/userData/models
          key: mnemoshelf-model-embeddinggemma-2-onnx-v1

      # 打包後真正索引 smoke（僅 Linux x64）：headless smoke 只驗 `/health` 與 token 驗證，
      # 不會觸發索引；這一步跑 `bootstrap,index` 才會真的啟動 worker／embedder 並建立索引。
      # smoke.mjs 自己會用 xvfb-run 啟動，這裡不要再包一層。第一次要下載模型（約 300 MB），
      # 之後靠上面的快取；索引本身可能較久，給 45 分鐘。
      - name: 打包後索引 smoke（Linux x64）
        if: matrix.platform == 'linux-x64'
        timeout-minutes: 45
        env:
          # GitHub runner 的 chrome-sandbox 不是 setuid，GUI 啟動需要 --no-sandbox；
          # 這個開關只影響 smoke 啟動的 GUI 行程，headless smoke 不受影響。
          MNEMOSHELF_SMOKE_NO_SANDBOX: "1"
        run: node packages/desktop/scripts/smoke.mjs gui --only bootstrap,index --user-data .tmp/desktop-ci-index/userData --out .tmp/desktop-ci-index --skip-build

      # 授權清單：以 desktop 為主的 production 相依閉包（含 @img/sharp-libvips-*／sqlite-vec-*），
      # 各平台各產生一份（內容反映該平台實際隨附的套件）。
      #
      # 必須產生在 `packages/desktop/dist-app/` 內（與安裝檔同層）：upload-artifact v4 以
      # 「所有搜尋路徑的最小共同祖先（LCA）」為 artifact 根，若授權清單放在 repo 根，
      # LCA 會變成 repo 根，安裝檔在 artifact 內就多了 `packages/desktop/dist-app/` 這層；
      # 之後 release job 的 `find`／`gh release create` 就會拿到目錄而失敗。
      - name: 產生授權清單
        shell: bash
        run: |
          pnpm --filter "@mnemoshelf/desktop..." licenses list --prod --long > "packages/desktop/dist-app/third-party-licenses-${{ matrix.platform }}.txt"

      # workflow_dispatch 時，Actions artifact 額度可能已滿；macOS 測試包改放草稿 Release 供下載。
      # tag 一律用 `mac-test-...`（不是 `v*`），避免觸發 `on: push: tags: v*` 的正式發版流程。
      # 僅 macOS arm64 執行；草稿 Release 不是正式版本，測完可刪。
      - name: 建立 macOS 草稿 Release（workflow_dispatch）
        if: github.event_name == 'workflow_dispatch' && matrix.platform == 'macos-arm64'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="mac-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" --draft \
            --title "macOS 測試包 ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --notes "由 workflow_dispatch 產生的 macOS 測試包；不是正式 Release。來源：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            packages/desktop/dist-app/*.dmg \
            packages/desktop/dist-app/third-party-licenses-macos-arm64.txt

      - name: 上傳安裝檔與授權清單
        # workflow_dispatch 不上傳 artifacts（避免額度讓整個 run 紅）；tag 建置照舊。
        if: github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          # 找不到安裝檔就直接失敗（避免「看似成功但沒有附件」的無聲故障）。
          if-no-files-found: error
          path: |
            ${{ matrix.artifacts }}
            packages/desktop/dist-app/third-party-licenses-${{ matrix.platform }}.txt
          # private repo 的 Actions artifact 額度有限（免費方案 500 MB）；短保留期避免舊產物堆滿。
          retention-days: 7

  # 只有推送 v* tag 才發布；workflow_dispatch 不會走到這裡。
  release:
    name: 發布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - verify
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 取出原始碼（含歷史，供產生變更清單）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安裝 pnpm
        uses: pnpm/action-setup@v4

      - name: 安裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 下載安裝檔與授權清單
        uses: actions/download-artifact@v4
        with:
          path: dist
          # 單行花括號 glob：download-artifact v4 把整個 `pattern` 當成**單一** glob
          # 丟進 Minimatch，多行字串不匹配任何 artifact 名稱（會安靜地一個附件都不下載）。
          pattern: "{linux-*,macos-*,windows-*}"
          merge-multiple: true

      - name: 下載測試基準
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: test-baseline
          path: test-baseline

      - name: 產生 Release 說明
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          RANGE="${TAG}"
          if [ -n "${PREV}" ]; then RANGE="${PREV}..${TAG}"; fi
          {
            echo "Mnemoshelf 桌面版 ${TAG}。"
            echo
            echo "## 本次變更"
            git log --no-merges --pretty='- %s (%h)' "${RANGE}" || true
            echo
            echo "## 建置與測試基準"
            echo "- commit：${GITHUB_SHA}"
            echo "- 工作流程記錄：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- 建置：四條管線（Linux x64／Linux arm64／macOS Apple Silicon／Windows x64）各以原生 runner 建置。"
            echo "- 測試：pnpm install --frozen-lockfile、pnpm typecheck、pnpm build、pnpm test 全綠（verify job）。"
            echo
            echo '```'
            # 摘要 artifact 可能來自先前的 run（此步驟 continue-on-error）：最後再清一次 ANSI，
            # 確保 Release 頁面的「建置與測試基準」為純文字。
            cat test-baseline/test-summary.txt 2>/dev/null | sed -E 's/\x1b\[[0-9;?]*[a-zA-Z]//g' || echo "(測試摘要請見本次 run 的 verify job 記錄)"
            echo '```'
            echo
            echo "## 附件"
            echo "- Linux x64／arm64：AppImage 與 tar.gz（檔名含平台與架構）"
            echo "- macOS Apple Silicon：dmg"
            echo "- Windows x64：NSIS 安裝檔（.exe）"
            echo "- 各平台另附 third-party-licenses-<平台>.txt（pnpm licenses list --prod 產出）"
            echo "- LGPL-3.0.txt、GPL-3.0.txt、THIRD-PARTY-NOTICES.md（授權全文與 libvips 原始碼取得方式）"
            echo
            echo "## 授權（LGPL-3.0 平台套件）"
            echo "- 本 App 隨附 @img/sharp-libvips-*（LGPL-3.0-or-later）平台套件，即 sharp 使用的預編 libvips。"
            echo "- 授權全文見附件 LGPL-3.0.txt 與 GPL-3.0.txt（LGPL-3.0 以 GPL-3.0 為基礎）。"
            echo "- 對應原始碼取得方式與 shared library 替換說明見附件 THIRD-PARTY-NOTICES.md。"
            echo
            echo "## 安裝（macOS 為 ad-hoc 簽章、未公證；Windows 未簽章）"
            echo "- macOS 安裝檔使用 ad-hoc 簽章（無開發者憑證、未公證），Windows 安裝檔未簽章；首次開啟會有系統警告："
            echo "  Windows：SmartScreen 視窗點「更多資訊」再點「仍要執行」；"
            echo "  macOS：在 Finder 對 App 按右鍵選「打開」，再確認一次。"
            echo "- 詳細說明（含從原始碼建置）見 repo 的 docs/building.md。"
          } > RELEASE_NOTES.md
          echo "----- RELEASE_NOTES.md -----"
          cat RELEASE_NOTES.md

      - name: 建立 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # 只收檔案（`find -type f`）：`dist/*` 會連目錄一起展開（例如萬一 artifact 內
          # 多了一層目錄），而 `gh release` 對目錄不會跳過、直接讀取失敗。
          mapfile -t dist_assets < <(find dist -type f | sort)
          if [ "${#dist_assets[@]}" -eq 0 ]; then
            echo "錯誤：dist/ 底下沒有任何附件（download-artifact 沒有抓到 artifact？）" >&2
            exit 1
          fi
          # 「有檔案」不等於「有安裝檔」：授權清單下載成功時 dist/ 也有檔案。
          # tag 發布會建四個平台，安裝檔以副檔名分四類——Linux 有 AppImage 與 tar.gz 兩種、
          # macOS 是 dmg、Windows 是 NSIS 產出的 exe，四類必須各至少一個才放行。
          missing_types=()
          for ext in "*.AppImage" "*.tar.gz" "*.dmg" "*.exe"; do
            found=false
            for asset in "${dist_assets[@]}"; do
              # 未加引號的 ${ext}：這裡要的是 glob 展開，不是字面比對。
              # shellcheck disable=SC2254
              case "${asset}" in ${ext}) found=true; break ;; esac
            done
            if [ "${found}" = false ]; then
              missing_types+=("${ext}")
            fi
          done
          if [ "${#missing_types[@]}" -ne 0 ]; then
            echo "錯誤：dist/ 缺少安裝檔類型：${missing_types[*]}（四平台各以副檔名計數，缺一即不發布）" >&2
            echo "實際從 dist/ 找到的檔案（${#dist_assets[@]} 個）：" >&2
            printf '  %s\n' "${dist_assets[@]}" >&2
            exit 1
          fi
          echo "Release 附件（${#dist_assets[@]} 個來自 dist/）："
          printf '  %s\n' "${dist_assets[@]}"
          assets=(
            "${dist_assets[@]}"
            docs/licenses/LGPL-3.0.txt
            docs/licenses/GPL-3.0.txt
            docs/licenses/THIRD-PARTY-NOTICES.md
          )
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            # 同一個 tag 重跑時（例如修正後重試）：更新說明並覆蓋附件，不重建 Release。
            gh release edit "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md \
              "${assets[@]}"
          fi
