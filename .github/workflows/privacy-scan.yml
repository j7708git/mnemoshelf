# 隱私掃描（密鑰 ＋ 個人本機路徑）
#
# 為什麼要有這個 workflow：
# - GitHub 免費層的 secret scanning 只擋「已知廠商、格式明確」的憑證，沒有通用密鑰偵測
#   與有效性驗證（那是 GitHub Advanced Security 的付費功能，個人 repo 開不了）。
# - 本機 commit／push 前的隱私 hook 只保護一台機器；別台機器推上來的內容不會經過它。
#   把同一套檢查放進 CI，任何推上來的 commit／PR 都會被掃。
# - 只讀取原始碼、不需要任何 secrets；失敗代表「有發現」或「掃描沒有完成」，
#   請看 log 指出的檔案與行號處理，不要用跳過檢查的方式合併。
#
# 觸發：push（main、dsh/**）、pull_request、workflow_dispatch。
# 規則來源：`.github/repo-privacy-policy.json`（個人路徑）與 `.gitleaks.toml`（密鑰）；
# 與本機 hook 同源，不在 workflow 裡另外寫一份規則。

name: privacy-scan

on:
  push:
    branches:
      - main
      - "dsh/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: 隱私掃描
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      # gitleaks 釘住 8.30.1：內建規則會隨版本變動，版本不同可能出現「本機乾淨、
      # CI 變紅」或相反的結果。checksum 取自同一次 release 的 checksums.txt
      # （gitleaks_8.30.1_checksums.txt），下載後先驗 sha256 再安裝。
      #
      # 下載與解壓都在 `$RUNNER_TEMP`（repo 外）：掃描腳本會把「未追蹤但未被忽略」
      # 的檔案也納入掃描，若把 tarball／執行檔留在工作目錄，就會被當成待掃檔案。
      - name: 安裝 gitleaks（釘版本並驗 checksum）
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}"
          curl -sSfL -o "${ARCHIVE}" "${URL}"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${ARCHIVE}" | sha256sum -c -
          tar -xzf "${ARCHIVE}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # 腳本會再確認 gitleaks 版本是 8.30.1，並以退出碼區分
      # 0（乾淨）／1（有發現）／2（工具或設定錯誤，掃描沒有完成）。
      - name: 掃描密鑰與個人本機路徑
        run: bash .github/scripts/scan-repo.sh
