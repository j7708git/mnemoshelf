# electron-builder 設定（決策依 M4 打包研究，2026-10 查證）
#
# 用法：
# - `pnpm --filter @mnemoshelf/desktop dist`：`tsc` + `electron-builder --dir`，產出未封裝目錄
#   在 `dist-app/` 底下；目錄名含架構後綴：x64 為 `linux-unpacked`，arm64 為
#   `linux-arm64-unpacked`（非 x64 才有後綴）（本機實跑驗收用）。
# - `pnpm --filter @mnemoshelf/desktop run dist:linux|dist:mac|dist:win`：產出安裝檔
#   （Linux：AppImage／tar.gz；macOS：dmg；Windows：NSIS）。CI 發版走這一條。
#
# 注意：electron-builder 的 npm `latest` tag 落後（26.15.3），最新 26.x 在 `v26` tag
# （26.17.0）。版本在 package.json 明確釘住，不要改成浮動版本。
appId: dev.mnemoshelf.app
productName: Mnemoshelf

directories:
  output: dist-app

# 執行檔名（預設會用 package.json 的 scoped name 變成 `@mnemoshelfdesktop`）。
executableName: mnemoshelf

# 安裝檔命名一律帶平台與架構：`${os}` 是目標平台（linux／mac／win）、`${arch}` 是目標架構
# （electron-builder 會依 target 正規化，例如 x64 的 AppImage 是 `x86_64`）。
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# --- 更新來源（electron-updater）---
#
# 這裡只描述「更新 feed 在哪裡」，不含任何 token：CI 發佈 Release 仍由
# `.github/workflows/desktop-release.yml` 的 `gh release` 負責（electron-builder 只建置、
# 不經手 GitHub API）。
#
# owner／repo 明寫的原因：electron-builder 26.17.0 不會讀 CI 的 `GITHUB_REPOSITORY`，
# 只會從 package.json 的 `repository` 欄位或 git remote（`.git/config`）推斷；本 repo
# 的 package.json 沒有 `repository`，若依賴 git remote，產出的 `app-update.yml` 會隨
# checkout 方式而異。owner/repo 已在公開 README 的 Releases 連結出現，不是新資訊。
#
# `publish` 同時決定兩件事：
# - `--publish never` 下仍會產生 `latest*.yml`（electron-builder 的 update info 產生
#   不受 isPublish 影響；見 app-builder-lib PublishManager）。
# - 打包時寫進 resources 的 `app-update.yml`（electron-updater 執行期讀取的 feed 設定）。
publish:
  provider: github
  owner: j7708git
  repo: mnemoshelf

# --- 三平台安裝檔 target ---
#
# Linux 的 arch 不寫死：CI 用兩個 runner（x64／arm64）各建各的，預設就是「目前機器」的架構。
# AppImage 是本專案 Linux 產物中唯一支援 electron-updater 自動更新的格式；tar.gz 僅供手動安裝
# （沒有 APPIMAGE 環境變數時 updater 會自行停用，見 U0 研究筆記）。
linux:
  target:
    - AppImage
    - tar.gz
  category: Utility

# macOS 只支援 Apple Silicon（arm64）。
# **不要加 zip**：本專案的自動更新走 B 案（只檢查版本＋開啟下載頁），不用 Squirrel.Mac；
# electron-updater 的 MacUpdater 需要 zip 才能下載／安裝，而我們不呼叫它。
# 只有 dmg target 時 electron-builder 不會產生 `latest-mac.yml`，這是預期行為。
mac:
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.productivity
  # identity: "-" = ad-hoc 簽章（無身份證明的自我簽章）：不是完全不簽，而是以無憑證的
  # 臨時簽章讓 macOS 接受執行檔；Gatekeeper 首次執行仍會提示（未公證），繞過方式見 docs/building.md。
  # v26 的語意：「未設定」會去 keychain 找憑證、找不到才跳過；設 "-" 則明確走 ad-hoc。
  identity: "-"

win:
  # Windows 未簽章（沒有程式碼簽章憑證），也不設 `publisherName`：electron-updater
  # 6.8.11 的 NsisUpdater 只有在 app-update.yml 有 publisherName 時才驗 Authenticode，
  # 沒有就跳過。**不要**為了讓更新過關而設 `verifyUpdateCodeSignature: false`
  # （見 project-notes 的 U0 研究筆記；v27 前重新評估簽章）。
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

asar: true

# 應用程式檔（相對 app 目錄＝packages/desktop）。有 include pattern 時 electron-builder
# 不會自動補 `**/*`；`package.json` 與 production `node_modules/**` 一律會加進來。
files:
  - dist/**
  - package.json
  - "!**/*.map"

# worker_threads 不能讀 asar 內的檔案：worker 入口與它 import 的依賴都必須是真實檔案。
# 只解包入口不夠——worker 會 import `@mnemoshelf/embedder-transformers` →
# `@huggingface/transformers`（及其純 JS／原生依賴），這些若留在 `app.asar` 內，
# worker thread 讀不到而無法載入模型。因此 production `node_modules` 全部解包：
# sharp／@img、sqlite-vec、onnxruntime 等原生模組也一併涵蓋（個別條目已不需要）。
# app 自身 `dist/**` 仍留在 asar；worker 入口解包後由 worker-embedder 的 resolver
# 改指 `app.asar.unpacked`（見 packages/server/src/worker-embedder.ts）。
asarUnpack:
  - "**/node_modules/**"

# Web UI 靜態檔放在 asar 之外（resources/web），由 Core 服務以 MNEMOSHELF_WEB_DIR 讀取。
# 放在 asar 內也可以（Electron 會導向），但靜態檔沒有必要進 asar，也讓「UI 是不是打包進去」
# 一眼可驗。
extraResources:
  - from: ../web/dist
    to: web
    filter:
      - "**/*"
      # 不要把 sourcemap 一起送進產物（asar 那邊也排除了 `*.map`）。
      - "!**/*.map"

# 四個原生模組都是 N-API／Node-API，不需 @electron/rebuild（研究中已確認）。
npmRebuild: false

# Electron 預設帶全套 locale；只留會用到的，縮小體積。
electronLanguages:
  - en-US
  - zh-TW
  - zh-CN
  - ja
