# electron-builder 設定（決策依 M4 打包研究，2026-10 查證）
#
# 用法：
# - `pnpm --filter @mnemoshelf/desktop dist`：`tsc` + `electron-builder --dir`，產出未封裝目錄
#   在 `dist-app/` 底下；目錄名含架構後綴：x64 為 `linux-unpacked`，arm64 為
#   `linux-arm64-unpacked`（非 x64 才有後綴）（本機實跑驗收用）。
# - `pnpm --filter @mnemoshelf/desktop run dist:linux|dist:mac|dist:win`：產出安裝檔
#   （Linux：AppImage／tar.gz；macOS：dmg；Windows：NSIS）。CI 發版走這一條。
#
# 注意：electron-builder 的 npm `latest` tag 落後（26.15.3），最新 26.x 在 `v26` tag
# （26.17.0）。版本在 package.json 明確釘住，不要改成浮動版本。
appId: dev.mnemoshelf.app
productName: Mnemoshelf

directories:
  output: dist-app

# 執行檔名（預設會用 package.json 的 scoped name 變成 `@mnemoshelfdesktop`）。
executableName: mnemoshelf

# 安裝檔命名一律帶平台與架構：`${os}` 是目標平台（linux／mac／win）、`${arch}` 是目標架構
# （electron-builder 會依 target 正規化，例如 x64 的 AppImage 是 `x86_64`）。
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# --- 三平台安裝檔 target ---
#
# Linux 的 arch 不寫死：CI 用兩個 runner（x64／arm64）各建各的，預設就是「目前機器」的架構。
linux:
  target:
    - AppImage
    - tar.gz
  category: Utility

# macOS 只支援 Apple Silicon（arm64）。
mac:
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.productivity
  # identity: "-" = ad-hoc 簽章（無身份證明的自我簽章）：不是完全不簽，而是以無憑證的
  # 臨時簽章讓 macOS 接受執行檔；Gatekeeper 首次執行仍會提示（未公證），繞過方式見 docs/building.md。
  # v26 的語意：「未設定」會去 keychain 找憑證、找不到才跳過；設 "-" 則明確走 ad-hoc。
  identity: "-"

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

asar: true

# 應用程式檔（相對 app 目錄＝packages/desktop）。有 include pattern 時 electron-builder
# 不會自動補 `**/*`；`package.json` 與 production `node_modules/**` 一律會加進來。
files:
  - dist/**
  - package.json
  - "!**/*.map"

# 必須從 asar 解包的原生二進位（解開後落在 app.asar.unpacked，Electron 會透明導向）：
asarUnpack:
  # sharp 官方指定的寫法：libvips 的側載檔在 @img/* 內，不是 .node，自動偵測抓不到。
  - "**/node_modules/sharp/**"
  - "**/node_modules/@img/**"
  # sqlite-vec 的 loadExtension() 需要真實檔案路徑（.so／.dylib／.dll）。
  - "**/node_modules/sqlite-vec*/**"
  # onnxruntime-node：onnxruntime_binding.node 與 libonnxruntime.so／.dll。
  - "**/*.node"
  - "**/node_modules/onnxruntime-node/bin/**"

# Web UI 靜態檔放在 asar 之外（resources/web），由 Core 服務以 MNEMOSHELF_WEB_DIR 讀取。
# 放在 asar 內也可以（Electron 會導向），但靜態檔沒有必要進 asar，也讓「UI 是不是打包進去」
# 一眼可驗。
extraResources:
  - from: ../web/dist
    to: web
    filter:
      - "**/*"
      # 不要把 sourcemap 一起送進產物（asar 那邊也排除了 `*.map`）。
      - "!**/*.map"

# 四個原生模組都是 N-API／Node-API，不需 @electron/rebuild（研究中已確認）。
npmRebuild: false

# Electron 預設帶全套 locale；只留會用到的，縮小體積。
electronLanguages:
  - en-US
  - zh-TW
  - zh-CN
  - ja
