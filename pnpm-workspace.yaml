packages:
  - packages/*

# 安全性修補：把 transitive 依賴釘到修補版，只在 workspace root 生效。
# 父層宣告範圍都接受這些版本（`@electron/get` 的 undici ^7.24.4、node-gyp ^6.25.0、
# `@effect/platform-node`／testcontainers 的 undici ^8.11.2、express 的 body-parser ^2.3.0）。
overrides:
  "undici@^6.0.0": "6.29.1"
  "undici@^7.0.0": "7.30.1"
  "undici@^8.0.0": "8.12.3"
  "body-parser@^2.3.0": "2.4.0"

# 注意：不要把 better-sqlite3 加進 onlyBuiltDependencies。
#
# better-sqlite3 13.x 以 N-API（NAPI_VERSION=10）發布，tarball 內含各平台預編譯
# （prebuilds/*.node，含 win32-x64），執行期由 lib/binding.js 依 platform／arch 直接載入，
# 不需要 node-gyp 產物；套件本身也已宣告 gypfile: false 且沒有 install script。
#
# 一旦列入 onlyBuiltDependencies，pnpm 10 會替它執行 `node-gyp rebuild`（pnpm 不看
# gypfile: false）。node-gyp 在 Windows 的 configure 階段就會偵測 Visual Studio，
# 而且早於 binding.gyp 的 prebuild 短路判斷，因此機器上沒有可用 VS 時會讓
# `pnpm install` 直接失敗——即使最後什麼都不必編譯。
